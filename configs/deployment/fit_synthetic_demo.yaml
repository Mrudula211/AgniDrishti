# Site calibration config for scripts/fit_pipeline.py (FR-20, ADR-006).
#
# This file is the SYNTHETIC demo site (parameters iddq, tpd of the development v1
# generator). A real site copies it and sets its own parameters, directions and
# drift allowance; nothing here is an ISRO value.
#
# Methods (gate, lot statistics, predictors, conformal alpha, operating point) are
# NOT set here: they are read from the pre-registered experiment config below, so a
# deployed pipeline is fitted by exactly the procedure evaluated in E1-E6.

methods_from: configs/experiments/pipeline_v1.yaml

label:                              # ADR-002 / ADR-004 proxy label on historical lots
  primary: label_safety_slope
  allowance: {kind: relative, value: 0.15}   # Δ_allow — a site reliability decision [PR], one value for all parameters
  directions: {iddq: up, tpd: up}            # every parameter in the data needs 'up' or 'down'

splits:                             # used only when the historical data has no `split` column
  fractions: {train: 0.60, calibration: 0.20, validation: 0.20}   # whole lots [PR]
  seed: 20260926
