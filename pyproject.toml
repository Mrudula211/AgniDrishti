[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agnidrish"
version = "0.1.0"
description = "AgniDrishti — burn-in screening for SIH 2026 PS 26170"
requires-python = ">=3.11"
dependencies = [
    # Lot tables: grouping by lot/parameter, missing-value handling (FR-01, FR-02).
    "pandas>=2.0,<3",
    # Vectorised finite-value checks and seeded random generation; already required by pandas.
    "numpy>=1.24,<3",
    # Experiment configs are YAML (CLAUDE.md §17: configs/<area>/<name>.yaml).
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
